<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital CPU — 10 орбит</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #0b1420;
      --surface: #122635;
      --panel: #101d2b;
      --line: #2c4556;
      --text: #e7eef2;
      --muted: #a5b5c4;
      --cyan: #67c4de;
      font-family: "IBM Plex Sans", "Noto Sans", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: radial-gradient(ellipse at 45% 0, #18354a 0, transparent 62%), var(--canvas);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
    .sheet { max-width: 1600px; margin: auto; padding: 30px 34px 24px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .wordmark, .edition, .index, .kind, .scale, .footer {
      font-family: "IBM Plex Mono", monospace;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-size: 11px;
    }
    .wordmark { color: var(--cyan); font-weight: 500; }
    .wordmark span { color: var(--muted); letter-spacing: .03em; margin-left: 9px; }
    .edition { color: #8ca4b5; font-size: 10px; }
    .intro { display: flex; align-items: center; justify-content: space-between; gap: 36px; margin: 27px 0 28px; }
    h1 { margin: 0 0 10px; font-size: clamp(34px, 4vw, 52px); font-weight: 500; letter-spacing: -.055em; line-height: 1; }
    h1 span { color: var(--cyan); }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .controls { width: 400px; flex: 0 0 400px; }
    .control-head { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; }
    .control-head label { color: var(--muted); font-size: 12px; }
    output { font: 500 22px "IBM Plex Mono", monospace; color: var(--cyan); }
    input[type="range"] { width: 100%; display: block; margin: 10px 0 12px; accent-color: var(--cyan); cursor: pointer; }
    .control-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .presets { display: flex; gap: 5px; }
    .control-bottom button {
      min-height: 32px; padding: 5px 11px; border: 1px solid #385367; border-radius: 6px;
      background: #172c3e; color: var(--text); font-size: 11px;
    }
    .control-bottom button:hover { background: #234358; }
    .control-bottom button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
    .speed { color: #97acbc; font: 11px "IBM Plex Mono", monospace; white-space: nowrap; }
    .gallery { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 15px; }
    .concept {
      min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 12px;
      background: linear-gradient(155deg, #163044, var(--surface) 65%);
    }
    .concept-head { display: flex; justify-content: space-between; gap: 8px; padding: 14px 16px 0; }
    .index { color: var(--cyan); }
    .kind { color: #8ba4b7; font-size: 9px; letter-spacing: .08em; }
    .stage { height: 153px; display: grid; place-items: center; position: relative; margin-top: 3px; }
    .stage::before, .stage::after { content: ""; position: absolute; pointer-events: none; }
    .stage::before { width: 150px; height: 150px; border: 1px solid #75aec210; border-radius: 50%; }
    .stage::after { width: 160px; border-top: 1px solid #75aec20c; }
    .hero-icon { width: 126px; height: 126px; position: relative; z-index: 1; }
    .hero-icon svg, .panel-icon svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .copy { padding: 8px 16px 15px; min-height: 82px; }
    h2 { margin: 0 0 6px; font-size: 18px; font-weight: 500; letter-spacing: -.02em; }
    .copy p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .panel-preview {
      height: 60px; padding: 8px 16px; display: flex; align-items: center; gap: 14px;
      background: var(--panel); border-top: 1px solid #294154;
    }
    .panel-icon { width: 44px; height: 44px; flex: 0 0 44px; }
    .panel-separator { height: 23px; width: 1px; background: #344a5b; }
    .scale { color: #92a8b8; font-size: 10px; letter-spacing: .05em; line-height: 1.6; }
    .scale span { display: block; font-size: 11px; letter-spacing: 0; color: var(--muted); text-transform: none; font-family: "IBM Plex Sans", sans-serif; }
    .footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 20px; color: #91a7b8; font-size: 10px; letter-spacing: .05em; }
    @media (max-width: 1260px) { .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 820px) {
      .sheet { padding: 22px 20px; }
      .intro { align-items: start; flex-direction: column; gap: 24px; }
      .controls { width: min(100%, 440px); flex: auto; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .edition { display: none; }
    }
    @media (max-width: 460px) {
      .sheet { padding: 20px 16px; }
      .gallery { grid-template-columns: 1fr; }
      .control-bottom { flex-wrap: wrap; }
      .wordmark span { font-size: 9px; }
      .stage { height: 165px; }
      .copy { min-height: auto; }
    }
    @media (pointer: coarse) { .control-bottom button { min-height: 44px; } input[type="range"] { min-height: 28px; } }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="masthead">
      <div class="wordmark">Orbital <span>/ визуальные исследования</span></div>
      <div class="edition">CPU · движение и геометрия</div>
    </div>
    <header class="intro">
      <div>
        <h1>CPU на орбите<span>.</span></h1>
        <p class="subtitle">Десять вариантов геометрии и движения.<br>Увеличенный вид и превью в размере панели.</p>
      </div>
      <div class="controls">
        <div class="control-head">
          <label for="cpu-load">Нагрузка CPU · симуляция</label>
          <output id="load-output" for="cpu-load" aria-live="polite">42%</output>
        </div>
        <input id="cpu-load" type="range" min="0" max="100" step="1" value="42">
        <div class="control-bottom">
          <div class="presets" aria-label="Нагрузка CPU">
            <button type="button" data-load="0">0%</button>
            <button type="button" data-load="50">50%</button>
            <button type="button" data-load="100">100%</button>
          </div>
          <span id="speed" class="speed">12,6 об/мин</span>
          <button id="motion" type="button" aria-pressed="false">Пауза</button>
        </div>
      </div>
    </header>
    <section id="gallery" class="gallery" aria-label="Десять прототипов Orbital CPU"></section>
    <footer class="footer">
      <span>Скорость орбиты следует нагрузке · 0–30 об/мин</span>
      <span>Превью 44 px · тёмная палитра Orbital</span>
    </footer>
  </main>
  <script>
    (() => {
      'use strict';
      const palette = { cyan: '#67c4de', white: '#e7eef2', track: '#547c8c', dim: '#2f4d60', panel: '#101d2b' };
      const loadInput = document.getElementById('cpu-load');
      const loadOutput = document.getElementById('load-output');
      const motionButton = document.getElementById('motion');
      const gallery = document.getElementById('gallery');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = reducedMotion.matches;
      let load = Number(loadInput.value);
      let angle = 32;
      let lastTime = 0;
      let movers = [];
      let orbiters = [];
      let pulses = [];
      const rad = degrees => degrees * Math.PI / 180;
      const f = value => Number(value.toFixed(3));
      const point = (radius, degrees) => [f(60 + radius * Math.cos(rad(degrees))), f(60 + radius * Math.sin(rad(degrees)))];
      const circle = (r, stroke = palette.track, width = 1.8, extra = '') => `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${stroke}" stroke-width="${width}" ${extra}/>`;
      const ellipse = (rx, ry, tilt, extra = '') => `<ellipse cx="60" cy="60" rx="${rx}" ry="${ry}" transform="rotate(${tilt} 60 60)" fill="none" stroke="${palette.track}" stroke-width="1.7" ${extra}/>`;
      const dot = (x, y, r = 6, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${palette.cyan}" ${extra}/><circle cx="${f(x - r * .22)}" cy="${f(y - r * .26)}" r="${f(r * .25)}" fill="${palette.white}"/>`;
      const core = (p, mask = false) => `${mask ? `<rect x="23" y="42" width="74" height="36" rx="15" fill="${palette.panel}"/>` : ''}<text x="60" y="61" fill="${palette.white}" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="30" font-weight="500" text-anchor="middle" dominant-baseline="central">${p}%</text>`;
      const spin = (body, rate = 1) => `<g data-spin="${rate}">${body}</g>`;
      function arc(r, start, end) {
        const a = point(r, start), b = point(r, end);
        return `M ${a.join(' ')} A ${r} ${r} 0 ${end - start > 180 ? 1 : 0} 1 ${b.join(' ')}`;
      }
      function tail(r, length, count = 14) {
        if (length <= 0) return '';
        let result = '';
        for (let i = 0; i < count; i++) {
          const start = -90 - length + length * i / count;
          result += `<path d="${arc(r, start, start + length / count + .15)}" fill="none" stroke="${palette.cyan}" stroke-width="${f(1 + 4 * i / count)}" opacity="${f(.04 + .7 * i / count)}" stroke-linecap="round"/>`;
        }
        return result;
      }
      function satellite(kind) {
        return `<g data-orbit="${kind}">${dot(0, 0, 6)}</g>`;
      }
      function sputnik(p) {
        return circle(45) + spin(dot(60, 9, 7) + `<circle cx="60" cy="9" r="11" fill="none" stroke="${palette.cyan}" stroke-width="1" opacity=".13"/>`) + core(p);
      }
      function comet(p) {
        return circle(48, palette.dim, 1.4) + spin(tail(48, p * 1.25) + dot(60, 12, 6.5)) + core(p);
      }
      function binary(p) {
        return circle(43, palette.track, 1.5) + circle(54, palette.dim, 1.5)
          + spin(dot(60, 17, 5.5)) + spin(`<circle cx="60" cy="6" r="4.2" fill="${palette.white}"/>`, -.72) + core(p);
      }
      function apogee(p) {
        return ellipse(52, 35, -28) + satellite('apogee') + core(p);
      }
      function radar(p) {
        const length = 24 + p * .65;
        let ticks = '';
        for (const a of [-90, 0, 90, 180]) {
          const one = point(54, a), two = point(58, a);
          ticks += `<path d="M ${one.join(' ')} L ${two.join(' ')}" stroke="${palette.track}" stroke-width="2" stroke-linecap="round"/>`;
        }
        let sweep = '';
        for (let i = 0; i < 12; i++) {
          const start = -90 - length + i * length / 12;
          sweep += `<path d="${arc(44, start, start + length / 12 + .1)}" stroke="${palette.cyan}" stroke-width="13" fill="none" opacity="${f(.015 + i * .016)}"/>`;
        }
        return circle(50, palette.dim, 1.5) + circle(37, palette.dim, 1.3) + ticks
          + spin(sweep + `<path d="M 60 8 V 22" stroke="${palette.cyan}" stroke-width="2.4" stroke-linecap="round"/>` + dot(60, 10, 3.5)) + core(p);
      }
      function constellation(p) {
        const points = [-90, 30, 150].map(a => point(47, a));
        const triangle = `<path d="M ${points.map(x => x.join(' ')).join(' L ')} Z" stroke="${palette.cyan}" stroke-width="1.3" fill="none" opacity=".45"/>`;
        return circle(47, palette.dim, 1.6, 'stroke-dasharray="2 7"')
          + spin(triangle + points.map((v, i) => dot(v[0], v[1], [6, 4.5, 3.5][i])).join('')) + core(p, true);
      }
      function gyroscope(p) {
        return ellipse(53, 29, -45) + ellipse(53, 29, 45, 'opacity=".55"')
          + satellite('gyro-a') + satellite('gyro-b') + core(p, true);
      }
      function pulsar(p) {
        return circle(48, palette.track, 1.8, 'stroke-dasharray="2 6" stroke-linecap="round"')
          + `<circle cx="60" cy="60" r="34" data-pulse="0" fill="none" stroke="${palette.cyan}" stroke-width="1.5"/>`
          + `<circle cx="60" cy="60" r="40" data-pulse="1" fill="none" stroke="${palette.cyan}" stroke-width="1.5"/>`
          + spin(`<path d="M 60 5 L 67 12 L 60 19 L 53 12 Z" fill="${palette.cyan}"/><circle cx="60" cy="12" r="2.2" fill="${palette.white}"/>`) + core(p);
      }
      function planet(p) {
        return circle(43, palette.track, 1.4) + ellipse(20, 43, 0, 'opacity=".33"')
          + ellipse(37, 43, 0, 'opacity=".2"') + ellipse(43, 13, 0, 'opacity=".4"')
          + ellipse(55, 33, -18) + satellite('planet') + core(p, true);
      }
      function contour(p) {
        let pins = '';
        for (const offset of [40, 53, 67, 80]) {
          pins += `<path d="M ${offset} 18 V 23 M ${offset} 97 V 102 M 15 ${offset} H 20 M 100 ${offset} H 105" stroke="${palette.track}" stroke-width="2.3"/>`;
        }
        let path = '';
        for (let i = 0; i <= 96; i++) {
          const t = i * Math.PI * 2 / 96;
          const x = 60 + 49 * Math.sign(Math.cos(t)) * Math.abs(Math.cos(t)) ** .5;
          const y = 60 + 49 * Math.sign(Math.sin(t)) * Math.abs(Math.sin(t)) ** .5;
          path += `${i ? ' L' : 'M'} ${f(x)} ${f(y)}`;
        }
        return `<path data-contour-track d="${path} Z" stroke="${palette.track}" stroke-width="1.7" fill="none"/>`
          + pins + `<rect x="20" y="23" width="80" height="74" rx="10" fill="${palette.panel}" stroke="${palette.dim}" stroke-width="1.7"/>`
          + `<g data-orbit="contour"><rect x="-5" y="-5" width="10" height="10" rx="3" fill="${palette.cyan}"/><circle cx="-1" cy="-1" r="1.5" fill="${palette.white}"/></g>` + core(p);
      }
      const concepts = [
        { name: 'Спутник', kind: 'Одна точка', description: 'Тонкое кольцо и один спутник. Ближе всего к текущему CPU.', draw: sputnik },
        { name: 'Комета', kind: 'Световой след', description: 'Орбитальный шлейф удлиняется с ростом нагрузки.', draw: comet },
        { name: 'Бинарная', kind: 'Противоход', description: 'Два спутника на разных радиусах движутся навстречу.', draw: binary },
        { name: 'Апогей', kind: 'Эллипс', description: 'Наклонная орбита: разгон у перигея, замедление у апогея.', draw: apogee },
        { name: 'Радар', kind: 'Сектор', description: 'Луч сканирует кольцо. При нагрузке его след становится шире.', draw: radar },
        { name: 'Созвездие', kind: 'Три спутника', description: 'Три связанные точки вращаются как одна орбитальная система.', draw: constellation },
        { name: 'Гироскоп', kind: 'Две плоскости', description: 'Пересекающиеся орбиты с независимыми спутниками.', draw: gyroscope },
        { name: 'Пульсар', kind: 'Импульс', description: 'Маяк на пунктирной орбите. Внутренние кольца пульсируют.', draw: pulsar },
        { name: 'Планета', kind: 'Глубина', description: 'Спутник огибает сферу и тускнеет на дальней стороне.', draw: planet },
        { name: 'Контур', kind: 'Вокруг чипа', description: 'Орбита становится мягким квадратом вокруг процессора.', draw: contour }
      ];
      gallery.innerHTML = concepts.map((c, i) => `
        <article class="concept" aria-labelledby="concept-${i}">
          <div class="concept-head"><span class="index">${String(i + 1).padStart(2, '0')}</span><span class="kind">${c.kind}</span></div>
          <div class="stage"><div class="hero-icon" data-concept="${i}"></div></div>
          <div class="copy"><h2 id="concept-${i}">${c.name}</h2><p>${c.description}</p></div>
          <div class="panel-preview"><div class="panel-icon" data-concept="${i}" aria-hidden="true"></div><div class="panel-separator"></div><div class="scale">44 px<span>В размере панели</span></div></div>
        </article>`).join('');
      const iconHosts = [...gallery.querySelectorAll('[data-concept]')];
      function render() {
        load = Number(loadInput.value);
        loadOutput.value = `${load}%`;
        document.getElementById('speed').textContent = `${(load * .3).toLocaleString('ru-RU', { maximumFractionDigits: 1 })} об/мин`;
        document.querySelectorAll('[data-load]').forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.load) === load)));
        iconHosts.forEach(host => {
          const concept = concepts[Number(host.dataset.concept)];
          host.innerHTML = `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${concept.name}: CPU ${load}%">${concept.draw(load)}</svg>`;
        });
        movers = [...gallery.querySelectorAll('[data-spin]')];
        orbiters = [...gallery.querySelectorAll('[data-orbit]')].map(node => {
          const track = node.dataset.orbit === 'contour' ? node.closest('svg').querySelector('[data-contour-track]') : null;
          return { node, track, length: track ? track.getTotalLength() : 0 };
        });
        pulses = [...gallery.querySelectorAll('[data-pulse]')];
        paint();
      }
      function ellipsePoint(theta, rx, ry, tilt) {
        const x = rx * Math.cos(theta), y = ry * Math.sin(theta), t = rad(tilt);
        return [f(60 + x * Math.cos(t) - y * Math.sin(t)), f(60 + x * Math.sin(t) + y * Math.cos(t))];
      }
      function paint() {
        movers.forEach(node => node.setAttribute('transform', `rotate(${f(angle * Number(node.dataset.spin))} 60 60)`));
        orbiters.forEach(({ node, track, length }) => {
          let pos;
          const theta = rad(angle - 90);
          switch (node.dataset.orbit) {
            case 'apogee': {
              // Kepler's equation gives a visible slow/fast passage around the ellipse.
              const eccentricity = .45;
              let eccentricAngle = theta;
              for (let i = 0; i < 5; i++) eccentricAngle -= (eccentricAngle - eccentricity * Math.sin(eccentricAngle) - theta) / (1 - eccentricity * Math.cos(eccentricAngle));
              pos = ellipsePoint(eccentricAngle, 52, 35, -28);
              break;
            }
            case 'gyro-a': pos = ellipsePoint(theta, 53, 29, -45); break;
            case 'gyro-b': pos = ellipsePoint(-theta * .72 + 1.9, 53, 29, 45); break;
            case 'planet': {
              pos = ellipsePoint(theta, 55, 33, -18);
              const front = (Math.sin(theta) + 1) / 2;
              node.setAttribute('opacity', f(.25 + .75 * front));
              break;
            }
            case 'contour': {
              const distance = ((angle - 90) % 360 + 360) % 360 / 360 * length;
              const position = track.getPointAtLength(distance);
              pos = [f(position.x), f(position.y)];
              break;
            }
          }
          node.setAttribute('transform', `translate(${pos.join(' ')})`);
        });
        pulses.forEach(node => {
          const wave = (Math.sin(rad(angle * 2 + Number(node.dataset.pulse) * 180)) + 1) / 2;
          node.setAttribute('r', f(35 + wave * 8));
          node.setAttribute('opacity', f(.08 + wave * load / 100 * .45));
        });
      }
      function syncMotion() {
        motionButton.textContent = paused ? 'Воспроизвести' : 'Пауза';
        motionButton.setAttribute('aria-pressed', String(paused));
      }
      loadInput.addEventListener('input', render);
      document.querySelectorAll('[data-load]').forEach(button => button.addEventListener('click', () => {
        loadInput.value = button.dataset.load;
        render();
      }));
      motionButton.addEventListener('click', () => { paused = !paused; syncMotion(); });
      reducedMotion.addEventListener('change', event => { paused = event.matches; syncMotion(); });
      document.addEventListener('visibilitychange', () => { lastTime = 0; });
      function frame(time) {
        if (lastTime && !paused && !document.hidden) {
          angle += Math.min(time - lastTime, 100) * load * .0018;
          paint();
        }
        lastTime = time;
        requestAnimationFrame(frame);
      }
      render();
      syncMotion();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
